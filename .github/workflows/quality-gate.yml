name: Quality Gate

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  lint-test:
    name: Lint, Type Check, Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run linters (flake8)
        run: flake8 src tests main.py

      - name: Run mypy
        run: mypy src main.py

      - name: Run pylint
        run: pylint src

      - name: Run pytest
        run: pytest --cov=src --cov-report=term-missing

      - name: Security audit
        run: |
          bandit -r src main.py
          pip-audit
